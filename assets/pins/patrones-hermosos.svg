<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-labelledby="title desc">
  <title id="title">Patrones Hermosos</title>
  <desc id="desc">Full-stack event operations platform with role-based workflows, analytics, audit trails, exports, and diploma generation.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="548" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091925"/>
      <stop offset="1" stop-color="#102F38"/>
    </linearGradient>
    <linearGradient id="accent" x1="28" y1="26" x2="528" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42D8C2"/>
      <stop offset="1" stop-color="#62A8F4"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B9E9E3" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="558" height="208" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="1" y="1" width="558" height="208" fill="url(#bg)"/>
    <rect x="1" y="1" width="558" height="208" fill="url(#grid)"/>
    <circle cx="518" cy="48" r="96" fill="#42D8C2" fill-opacity="0.04"/>
    <circle cx="506" cy="176" r="74" fill="#62A8F4" fill-opacity="0.03"/>

    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="28" y="25" width="30" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="28" y="48" fill="#8EB6BE" font-size="10" font-weight="700" letter-spacing="1.55">FULL-STACK CASE STUDY</text>
      <text x="500" y="36" fill="#6E929D" font-size="10" font-weight="700" letter-spacing="1.1">02 / 04</text>

      <text x="28" y="87" fill="#F3FAFC" font-size="27" font-weight="800" letter-spacing="-0.35">Patrones Hermosos</text>
      <text x="28" y="116" fill="#B9CDD5" font-size="13.2" font-weight="500">Event operations platform with role-based workflows,</text>
      <text x="28" y="136" fill="#B9CDD5" font-size="13.2" font-weight="500">analytics, audit trails, exports, and diploma generation.</text>

      <path d="M28 154H416" stroke="#47707A" stroke-opacity="0.48"/>
      <text x="28" y="178" fill="#91B9BE" font-size="10.5" font-weight="700" letter-spacing="0.7">NEXT.JS · TYPESCRIPT · EXPRESS · PRISMA · MYSQL</text>
    </g>

    <g stroke-linecap="round" stroke-linejoin="round">
      <rect x="460" y="70" width="68" height="68" rx="9" fill="#0B2430" stroke="#4B7A87" stroke-width="2"/>
      <path d="M460 91H528" fill="none" stroke="#4B7A87" stroke-width="2"/>
      <path d="M476 64V77M512 64V77" fill="none" stroke="#62A8F4" stroke-width="3"/>

      <g fill="#6E969F">
        <rect x="470" y="100" width="8" height="6" rx="2"/>
        <rect x="490" y="100" width="8" height="6" rx="2"/>
        <rect x="510" y="100" width="8" height="6" rx="2"/>
        <rect x="470" y="116" width="8" height="6" rx="2"/>
        <rect x="510" y="116" width="8" height="6" rx="2"/>
      </g>

      <rect x="489" y="114" width="10" height="10" rx="3" fill="url(#accent)"/>
      <path d="M491.5 119L493.5 121L497 117" fill="none" stroke="#071824" stroke-width="1.5"/>
    </g>
  </g>

  <rect x="1" y="1" width="558" height="208" rx="20" fill="none" stroke="#2C505C" stroke-width="2"/>
</svg>
