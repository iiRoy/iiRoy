<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-labelledby="title desc">
  <title id="title">OWARU</title>
  <desc id="desc">Professional internship case study covering a student dashboard, API integration, and system-dynamics research.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="548" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091925"/>
      <stop offset="1" stop-color="#102F38"/>
    </linearGradient>
    <linearGradient id="accent" x1="452" y1="62" x2="530" y2="146" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42D8C2"/>
      <stop offset="1" stop-color="#83DE73"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B9E9E3" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="558" height="208" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="1" y="1" width="558" height="208" fill="url(#bg)"/>
    <rect x="1" y="1" width="558" height="208" fill="url(#grid)"/>
    <circle cx="518" cy="48" r="96" fill="#42D8C2" fill-opacity="0.045"/>
    <circle cx="506" cy="176" r="74" fill="#83DE73" fill-opacity="0.035"/>

    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="28" y="25" width="30" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="28" y="48" fill="#8EB6BE" font-size="10" font-weight="700" letter-spacing="1.55">PROFESSIONAL EXPERIENCE</text>
      <text x="500" y="36" fill="#6E929D" font-size="10" font-weight="700" letter-spacing="1.1">01 / 04</text>

      <text x="28" y="87" fill="#F3FAFC" font-size="27" font-weight="800" letter-spacing="-0.35">OWARU</text>
      <text x="28" y="116" fill="#B9CDD5" font-size="13.2" font-weight="500">Professional internship: student dashboard and API</text>
      <text x="28" y="136" fill="#B9CDD5" font-size="13.2" font-weight="500">integration supported by system-dynamics research.</text>

      <path d="M28 154H416" stroke="#47707A" stroke-opacity="0.48"/>
      <text x="28" y="178" fill="#91B9BE" font-size="10.5" font-weight="700" letter-spacing="0.7">NEXT.JS · DJANGO · POSTGRESQL · SYSTEM DYNAMICS</text>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M461 78H523V135H461V78Z" stroke="#4B7A87" stroke-width="2"/>
      <path d="M473 92H511M473 105H500M473 119H488" stroke="#77A2AA" stroke-width="3.5"/>
      <path d="M491 128L501 117L511 122L523 106" stroke="url(#accent)" stroke-width="3"/>
      <circle cx="491" cy="128" r="3" fill="#42D8C2" stroke="none"/>
      <circle cx="501" cy="117" r="3" fill="#54D7AE" stroke="none"/>
      <circle cx="511" cy="122" r="3" fill="#67DA94" stroke="none"/>
      <circle cx="523" cy="106" r="3" fill="#83DE73" stroke="none"/>
    </g>
  </g>

  <rect x="1" y="1" width="558" height="208" rx="20" fill="none" stroke="#2C505C" stroke-width="2"/>
</svg>
